<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Rana</title>
<style>
:root{--ink:#EEF1FB;--mid:#C9AAFF;--dim:#9AA3C2;--mint:#3DF0A0;--violet:#8A4BF5;--navy:#0F1220;--gold:#F0C442;
 --line:color-mix(in srgb,#8A4BF5 40%,transparent);--panel:color-mix(in srgb,#0F1220 94%,transparent);
 --mono:'Consolas',ui-monospace,monospace;--sans:'Segoe UI',Inter,system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;font-family:var(--sans);height:100%}
#root{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
/* the one bubble: local prompts and dashboard tips */
#bub{max-width:262px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
 color:var(--ink);font-size:12.5px;line-height:1.5;margin-bottom:8px;display:none;box-shadow:0 14px 40px color-mix(in srgb,#0F1220 55%,transparent);animation:pop .3s var(--ease)}
#bub .who{display:block;font:600 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mid);margin-bottom:4px}
#bub .who.tip{color:var(--gold)}
#bub .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#bub button{font:600 11px var(--sans);border:none;border-radius:999px;padding:6px 11px;cursor:pointer;background:var(--mint);color:var(--navy)}
#bub button.g{background:transparent;border:1px solid var(--line);color:var(--mid)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* rana (the character bundle draws into #char) */
#char{width:160px;cursor:grab;filter:drop-shadow(0 12px 26px color-mix(in srgb,#8A4BF5 35%,transparent))}
#char.exzi-char-dragging{cursor:grabbing}
/* status chip + hover toolbar */
#chip{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--dim);background:var(--panel);border:1px solid color-mix(in srgb,#8A4BF5 25%,transparent);
 border-radius:999px;padding:4px 10px;margin-top:6px;white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}
#chip .g{color:var(--mint)}
#bar{display:none;gap:6px;margin-top:6px}
#bar button{font-size:12px;width:30px;height:26px;border-radius:8px;border:1px solid color-mix(in srgb,#8A4BF5 35%,transparent);background:var(--panel);color:var(--mid);cursor:pointer}
#bar button:hover{color:var(--ink);border-color:color-mix(in srgb,#8A4BF5 70%,transparent)}
#root:hover #bar{display:flex}
.paused #char{opacity:.55;filter:grayscale(.6)}
</style>
</head>
<body>
<div id="root">
  <div id="bub" aria-live="polite"></div>
  <div id="char"></div>
  <div id="chip">rana · waiting for consent…</div>
  <div id="bar">
    <button id="bPause" title="pause / resume">💤</button>
    <button id="bSet" title="settings, consent &amp; account">⚙️</button>
    <button id="bHide" title="hide Rana (the tray icon brings her back)">✕</button>
  </div>
</div>
<script src="vendor/exzi-character.js"></script>
<script src="buddy.js"></script>
</body>
</html>
